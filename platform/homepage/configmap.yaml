---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config

data:
  settings.yaml: |
    title: RV // HOMELAB
    theme: dark
    color: zinc
    headerStyle: boxedWidgets
    target: _blank
    statusStyle: dot

    layout:
      Operations:
        style: row
        columns: 4

      Observability:
        style: row
        columns: 4

      Network:
        style: row
        columns: 4

      Daily Ops:
        style: row
        columns: 5

      External:
        style: row
        columns: 4
        collapsed: true

  widgets.yaml: |
    - logo:
        icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/kubernetes.png

    - search:
        provider: google
        focus: false
        target: _blank

    - datetime:
        locale: da-DK
        text_size: xl
        format:
          dateStyle: full
          timeStyle: short

    # IMPORTANT:
    # Denne viser ressourcer for den node/container Homepage kører på.
    # Derfor ser du kun ~8GB RAM.
    # Fjernet for at undgå misvisende data i Kubernetes cluster.

    - openmeteo:
        label: Odense
        latitude: 55.4038
        longitude: 10.4024
        timezone: Europe/Copenhagen
        units: metric

  services.yaml: |
    - Operations:

        - ArgoCD:
            href: http://argocd.home
            description: GitOps control plane
            icon: argo-cd.png
            siteMonitor: http://argocd.home

        - Longhorn:
            href: http://longhorn.home
            description: Distributed storage
            icon: longhorn.png
            siteMonitor: http://longhorn.home

        - Traefik:
            href: http://traefik.home
            description: Edge ingress
            icon: traefik.png
            siteMonitor: http://traefik.home

        - PostgreSQL:
            description: Primary database
            icon: postgresql.png

    - Observability:

        - Grafana:
            href: http://grafana.home
            description: Dashboards & analytics
            icon: grafana.png
            siteMonitor: http://grafana.home/login

        - Prometheus:
            href: http://prometheus.home
            description: Metrics collection
            icon: prometheus.png
            siteMonitor: http://prometheus.home/-/healthy

        - Uptime Kuma:
            href: http://kuma.home
            description: Service monitoring
            icon: uptime-kuma.png
            siteMonitor: http://kuma.home

        - Loki:
            description: Centralized logs
            icon: loki.png

    - Network:

        - AdGuard Primary:
            href: http://192.168.87.60:3000
            description: DNS filtering
            icon: adguard-home.png
            siteMonitor: http://192.168.87.60:3000

        - AdGuard Secondary:
            href: http://192.168.87.74:3000
            description: Redundant DNS
            icon: adguard-home.png
            siteMonitor: http://192.168.87.74:3000

        - Router:
            href: http://192.168.87.1
            description: Gateway
            icon: mdi-router-network
            siteMonitor: http://192.168.87.1

        - Tailscale:
            href: https://tailscale.com
            description: Secure mesh VPN
            icon: tailscale.png

    - Daily Ops:

        - Paperless:
            href: http://paperless.home
            description: Document archive
            icon: paperless-ngx.png
            siteMonitor: http://paperless.home

        - Nextcloud:
            href: http://cloud.home
            description: Personal cloud
            icon: nextcloud.png
            siteMonitor: http://cloud.home/status.php

        - Gmail:
            href: https://mail.google.com
            description: Inbox
            icon: gmail.png

        - Calendar:
            href: https://calendar.google.com
            description: Scheduling
            icon: google-calendar.png

        - SDE:
            href: https://learn.sde.dk/login/index.php
            description: Education portal
            icon: mdi-school

    - External:

        - GitHub:
            href: https://github.com/RVinther/homelab
            description: Infrastructure repo
            icon: github.png

        - ChatGPT:
            href: https://chatgpt.com
            description: AI assistant
            icon: chatgpt.png

        - Reddit:
            href: https://reddit.com
            description: Communities
            icon: reddit.png

        - YouTube:
            href: https://youtube.com
            description: Media
            icon: youtube.png

  bookmarks.yaml: |
    - DevOps:
        - Kubernetes Docs:
            - abbr: K8S
              href: https://kubernetes.io/docs/

        - Helm Charts:
            - abbr: HELM
              href: https://artifacthub.io/

        - Docker Hub:
            - abbr: DKR
              href: https://hub.docker.com/

        - Terraform Registry:
            - abbr: TF
              href: https://registry.terraform.io/

    - Community:
        - Homelab:
            - abbr: LAB
              href: https://reddit.com/r/homelab

        - Selfhosted:
            - abbr: SELF
              href: https://reddit.com/r/selfhosted
