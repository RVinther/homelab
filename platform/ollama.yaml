---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://otwld.github.io/ollama-helm/
      chart: ollama
      targetRevision: 1.57.0
      helm:
        valueFiles:
          - $values/platform/ollama/values.yaml

    - repoURL: https://github.com/RVinther/homelab.git
      targetRevision: HEAD
      path: platform/ollama

    - repoURL: https://github.com/RVinther/homelab.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
