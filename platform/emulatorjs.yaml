---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: emulatorjs
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/RVinther/homelab.git
    targetRevision: HEAD
    path: platform/gaming
  
  destination:
    server: https://kubernetes.default.svc
    namespace: gaming

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
