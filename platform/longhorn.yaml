apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.6.2
      helm:
        values: |
          preUpgradeChecker:
            jobEnabled: false

    - repoURL: https://github.com/RVinther/homelab.git
      targetRevision: HEAD
      path: platform/longhorn

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApp=true

  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: "*"
      kind: "*"
      jsonPointers:
        - /status
